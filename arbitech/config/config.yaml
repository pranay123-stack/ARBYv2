# Arbitech Configuration File
# This file contains all configuration settings for the arbitrage trading system
# Environment variables can override these values using ARBITECH_<SECTION>__<KEY> format

# =============================================================================
# USER RISK CONFIGURATION
# =============================================================================
user:
  risk:
    # Maximum stake amount per bet
    max_stake: 1000.0
    
    # Risk percentage of bankroll per bet (0-100)
    risk_percentage: 2.0
    
    # Minimum odds to consider for betting
    min_odds: 1.5
    
    # Maximum odds to consider for betting
    max_odds: 10.0
    
    # Maximum number of concurrent bets
    max_concurrent_bets: 5
    
    # Stop loss percentage (optional, set to null to disable)
    stop_loss_percentage: 10.0
    
    # Take profit percentage (optional, set to null to disable)
    take_profit_percentage: 20.0
    
    # Minimum profit margin to consider
    min_profit_margin: 1.0
    
    # Maximum exposure per bookmaker
    max_exposure_per_bookmaker: 500.0

# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================
system:
  # VLM (Vision Language Model) parameters
  vlm:
    # Model configuration
    model:
      # Qwen2-VL model to use
      model_name: "Qwen/Qwen2-VL-2B-Instruct"
      
      # Custom model path (overrides model_name if provided)
      model_path: null
      
      # Device to use for inference
      device: "auto"  # "auto", "cpu", "cuda", "mps"
      
      # Model precision
      precision: "fp16"  # "fp16", "fp32", "int8", "int4"
      
      # Generation parameters
      max_new_tokens: 512
      temperature: 0.1
      top_p: 0.9
      top_k: 50
      repetition_penalty: 1.1
      
      # Image processing settings
      image_size: 224
      patch_size: 14
      
      # Context and memory settings
      max_length: 2048
      
      # Quantization settings
      load_in_8bit: false
      load_in_4bit: false
      
      # Trust remote code (for community models)
      trust_remote_code: true
    
    # Performance configuration
    performance:
      # Batch processing settings
      batch_size: 1
      max_batch_size: 4
      
      # Memory management
      max_memory_per_gpu: null  # e.g., "8GB"
      cpu_offload: false
      
      # Streaming settings
      use_streaming: true
      stream_interval: 0.1
      
      # Caching settings
      use_cache: true
      cache_dir: ".cache/vlm"
      
      # Worker settings
      num_workers: 4
      max_queue_size: 100
      
      # Timeout settings
      model_load_timeout: 300  # 5 minutes
      inference_timeout: 30    # 30 seconds
      
      # Rate limiting
      requests_per_minute: 60
      burst_limit: 10
    
    # Monitoring configuration
    monitoring:
      # Performance monitoring
      enable_performance_monitoring: true
      metrics_interval: 60.0
      
      # Memory monitoring
      monitor_memory_usage: true
      memory_threshold: 0.8  # 80%
      
      # Error tracking
      track_errors: true
      error_threshold: 10  # errors per hour
      
      # Logging
      enable_detailed_logging: true
      log_file: null
      
      # Health checks
      enable_health_checks: true
      health_check_interval: 300.0  # 5 minutes
    
    # Feature flags
    features:
      enable_image_processing: true
      enable_batch_processing: false
      enable_caching: true
      enable_async_inference: true
      enable_error_recovery: true
      enable_metrics_collection: true
      auto_device_config: false  # Automatically optimize device settings
    
    # Paths and directories
    cache_dir: ".cache/vlm"
    model_cache_dir: ".cache/models"
    log_dir: "logs/vlm"
    
    # Validation settings
    validate_on_load: true
    strict_validation: true
    
    # Legacy API settings (for backward compatibility)
    endpoint: "http://localhost:8080/vlm"
    api_key: null
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    enabled: true
    rate_limit_per_minute: 60
  
  # Scan intervals (in seconds)
  scan_intervals:
    # How often to scan for new opportunities
    general_scan: 60
    
    # How often to check live odds
    live_odds: 5
    
    # How often to update bookmaker data
    bookmaker_update: 30
    
    # How often to check account balances
    balance_check: 300
    
    # How often to perform health checks
    health_check: 120
  
  # System performance settings
  performance:
    # Maximum number of concurrent scans
    max_concurrent_scans: 10
    
    # Thread pool size for parallel operations
    thread_pool_size: 20
    
    # Memory limit in MB
    memory_limit: 1024
    
    # Cache expiration time in seconds
    cache_expiration: 300
  
  # Database settings
  database:
    # Database URL
    url: "sqlite:///data/arbitech.db"
    
    # Connection pool size
    pool_size: 10
    
    # Connection timeout in seconds
    timeout: 30
    
    # Enable database migrations
    migrations_enabled: true

