# Continuous Integration Configuration for Arbitrage Detection Testing
# This file can be used with GitHub Actions, Jenkins, or other CI systems

name: Comprehensive Arbitrage Detection Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
        pip install pytest pytest-cov pytest-xdist psutil
    
    - name: Generate test data
      run: |
        cd tests/create_test_data
        python market_data_generator.py
    
    - name: Run Quick Validation Tests
      run: |
        cd tests
        python run_comprehensive_tests.py --mode quick --parallel
    
    - name: Run Mathematical Tests
      run: |
        cd tests
        python test_mathematical_calculations.py
    
    - name: Run Arbitrage Detection Tests
      run: |
        cd tests
        python test_arbitrage_detection.py
    
    - name: Run Data Aggregation Tests
      run: |
        cd tests
        python test_data_aggregation.py
    
    - name: Run Comprehensive Test Suite
      run: |
        cd tests
        python run_comprehensive_tests.py --mode full --output-dir test_results_ci
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: tests/test_results_ci/
    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v1
      if: always()
      with:
        files: tests/test_results_ci/*.xml
        comment_mode: off

  performance-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
        pip install psutil memory-profiler
    
    - name: Generate Performance Test Data
      run: |
        cd tests/create_test_data
        python market_data_generator.py
    
    - name: Run Performance Benchmarks
      run: |
        cd tests
        python run_comprehensive_tests.py --mode full --output-dir performance_results
    
    - name: Performance Regression Check
      run: |
        cd tests
        python -c "
        import json
        import sys
        
        # Load latest performance results
        with open('performance_results/index.json') as f:
            latest_file = json.load(f)['test_data_index']['files'][-1]
        
        with open(f'performance_results/{latest_file}') as f:
            results = json.load(f)
        
        # Check key performance metrics
        overall_success = results['execution_summary']['overall_success_rate']
        total_time = results['execution_summary']['total_execution_time']
        
        if overall_success < 0.95:
            print(f'Performance regression: Success rate {overall_success:.2%} < 95%')
            sys.exit(1)
        
        if total_time > 300:  # 5 minutes
            print(f'Performance regression: Total time {total_time:.1f}s > 300s')
            sys.exit(1)
        
        print('Performance benchmarks passed')
        "
    
    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: tests/performance_results/

  stress-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
        pip install psutil
    
    - name: Run Stress Tests
      run: |
        cd tests
        python -c "
        import sys
        import asyncio
        import time
        from test_data_aggregation import DataAggregationTestSuite
        
        # Run stress tests
        suite = DataAggregationTestSuite()
        result = suite.test_performance_under_load()
        
        print(f'Stress test result: {result}')
        
        # Check stress test passed
        if not result.get('passed', False):
            print('Stress test failed')
            sys.exit(1)
        
        print('Stress tests passed')
        "

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Security Scan
      run: |
        # Install bandit for security scanning
        pip install bandit[toml]
        
        # Scan the codebase for security issues
        bandit -r . -f json -o security_report.json || true
        
        # Check for high severity issues
        python -c "
        import json
        import sys
        
        try:
            with open('security_report.json') as f:
                report = json.load(f)
            
            high_issues = [issue for issue in report.get('results', []) 
                          if issue.get('issue_severity') == 'HIGH']
            
            if high_issues:
                print(f'Found {len(high_issues)} high severity security issues')
                for issue in high_issues:
                    print(f'- {issue.get(\"filename\")}: {issue.get(\"issue_text\")}')
                sys.exit(1)
            else:
                print('No high severity security issues found')
        except:
            print('Could not parse security report')
        "
    
    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security_report.json

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
        pip install pytest pytest-cov
    
    - name: Run Tests with Coverage
      run: |
        cd tests
        python -m pytest --cov=../arbitech --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  notification:
    runs-on: ubuntu-latest
    needs: [test, performance-test, stress-test]
    if: always()
    
    steps:
    - name: Send Notification
      run: |
        # This could send notifications to Slack, email, etc.
        # For now, just output the status
        if [[ "${{ needs.test.result }}" == "success" && "${{ needs.performance-test.result }}" == "success" ]]; then
          echo "🎉 All tests passed! Ready for deployment."
        else
          echo "❌ Some tests failed. Please review before deployment."
        fi