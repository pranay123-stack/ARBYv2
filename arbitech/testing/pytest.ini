# Pytest configuration for ARBITech testing
[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=arbitech
    --cov-report=term-missing
    --cov-report=html:testing/htmlcov
    --cov-report=xml:testing/coverage.xml
    --cov-fail-under=80
    --durations=10
    --maxfail=5
    -p no:warnings

testpaths = testing
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    unit: Unit tests
    integration: Integration tests  
    e2e: End-to-end tests
    performance: Performance tests
    stress: Stress tests
    slow: Slow running tests
    regression: Regression tests
    vlm: Vision Language Model tests

# Filtering and warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
python_classes = Test*
python_functions = test_*

# Timeout configuration (requires pytest-timeout plugin)
timeout = 300
timeout_method = thread

# Parallel execution (requires pytest-xdist plugin)
# Uncomment to enable parallel execution
# addopts = -n auto
